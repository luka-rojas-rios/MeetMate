<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f6f8fb;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .form-wrapper { width: 100%; max-width: 760px; }
    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 28px;
    }
    h1 { color: #1f3c88; margin-bottom: 10px; }
    .subtitle { color: #556; margin-bottom: 20px; }
    .top-actions { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .top-actions a {
      text-decoration: none; background: #eef4ff; color: #1f3c88; padding: 10px 14px; border-radius: 8px;
      font-weight: 600;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    select, button {
      width: 100%; padding: 11px 12px; border: 1px solid #ccd3df; border-radius: 8px; font-size: 1rem;
      background: #fff;
    }
    select:focus { outline: none; border-color: #0077cc; box-shadow: 0 0 0 3px rgba(0, 119, 204, 0.12); }
    .hidden { display: none; }
    .message-box, .error-box {
      margin-bottom: 18px; padding: 14px 16px; border-radius: 10px;
    }
    .message-box { background: #e9f5ff; border-left: 5px solid #0077cc; }
    .error-box { background: #ffeceb; border-left: 5px solid #d93025; }
    .submit-btn {
      margin-top: 20px; background: #0077cc; color: white; font-weight: bold; cursor: pointer; border: none;
    }
    .submit-btn:hover { background: #005fa3; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <div class="card">
      <div class="top-actions">
        <a href="/match-profile">Match view</a>
        <a href="/edit-profile">Edit profile</a>
      </div>

      <h1>Start your first match!</h1>
      <p class="subtitle">Keep your information up to date to improve your matching results.</p>

      {% if message %}
        <div class="message-box">{{ message }}</div>
      {% endif %}

      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}

      <form id="studentForm" method="POST" action="/submit_match_profile">
        <div class="grid">
          <div>
            <label for="user_type">Student type</label>
            <select id="user_type" name="user_type" required>
              <option value="">Select an option</option>
              <option value="local" {% if user and user.user_type == 'local' %}selected{% endif %}>Local</option>
              <option value="exchange" {% if user and user.user_type == 'exchange' %}selected{% endif %}>Exchange</option>
            </select>
          </div>

          <div>
            <label for="language">Language 1</label>
            <select id="language" name="language" required>
              <option value="">Select a language</option>
            </select>
          </div>

          <div>
            <label for="language2">Language 2</label>
            <select id="language2" name="language2">
              <option value="">None</option>
            </select>
          </div>

          <div id="universitySection" class="{% if not user or not user.user_type %}hidden{% endif %}">
            <label for="country">Country</label>
            <select id="country" name="country" required>
              <option value="">Select a country</option>
            </select>
          </div>

          <div id="citySection" class="{% if not user or not user.user_type %}hidden{% endif %}">
            <label for="city">City</label>
            <select id="city" name="city" required>
              <option value="">Select a city</option>
            </select>
          </div>

          <div class="full {% if not user or not user.user_type %}hidden{% endif %}" id="universityField">
            <label for="university">University</label>
            <select id="university" name="university" required>
              <option value="">Select a university</option>
            </select>
          </div>

          <div>
            <label for="hobby_1">Hobby 1</label>
            <select id="hobby_1" name="hobby_1">
              <option value="">Select one</option>
            </select>
          </div>

          <div>
            <label for="hobby_2">Hobby 2</label>
            <select id="hobby_2" name="hobby_2">
              <option value="">Select another one</option>
            </select>
          </div>

          <div>
            <label for="favorite_sport_1">Favorite sport 1</label>
            <select id="favorite_sport_1" name="favorite_sport_1">
              <option value="">Select one</option>
            </select>
          </div>

          <div>
            <label for="favorite_sport_2">Favorite sport 2</label>
            <select id="favorite_sport_2" name="favorite_sport_2">
              <option value="">Select another one</option>
            </select>
          </div>
        </div>

        <button class="submit-btn" type="submit">Save match results</button>
      </form>
    </div>
  </div>

  <script>
    const universityData = {{ university_data | tojson }};
    const languages = {{ languages | tojson }};
    const hobbiesList = {{ hobbies | tojson }};
    const sportsList = {{ sports | tojson }};

    const currentValues = {
      language: {{ (user.language if user else '') | tojson }},
      language2: {{ (user.language_2 if user else '') | tojson }},
      hobby1: {{ (user.hobby_1 if user else '') | tojson }},
      hobby2: {{ (user.hobby_2 if user else '') | tojson }},
      sport1: {{ (user.favorite_sport_1 if user else '') | tojson }},
      sport2: {{ (user.favorite_sport_2 if user else '') | tojson }},
      country: {{ (selected_country or '') | tojson }},
      city: {{ (selected_city or '') | tojson }},
      university: {{ (selected_university or '') | tojson }}
    };

    function populateSelect(selectId, values, selectedValue = "", allowEmpty = false, emptyLabel = "Select an option") {
      const select = document.getElementById(selectId);
      select.innerHTML = "";
      const first = document.createElement('option');
      first.value = "";
      first.textContent = emptyLabel;
      select.appendChild(first);

      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        if (selectedValue === value) option.selected = true;
        select.appendChild(option);
      });

      if (!allowEmpty && selectedValue && !values.includes(selectedValue)) {
        select.value = "";
      }
    }

    function loadCities(selectedCountry, selectedCity = "") {
      const citySelect = document.getElementById('city');
      const universitiesSelect = document.getElementById('university');
      citySelect.innerHTML = '<option value="">Select a city</option>';
      universitiesSelect.innerHTML = '<option value="">Select a university</option>';

      if (!selectedCountry || !universityData[selectedCountry]) return;

      const cities = Object.keys(universityData[selectedCountry]);
      cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        option.textContent = city;
        if (city === selectedCity) option.selected = true;
        citySelect.appendChild(option);
      });
    }

    function loadUniversities(selectedCountry, selectedCity, selectedUniversity = "") {
      const universitiesSelect = document.getElementById('university');
      universitiesSelect.innerHTML = '<option value="">Select a university</option>';

      if (!selectedCountry || !selectedCity || !universityData[selectedCountry] || !universityData[selectedCountry][selectedCity]) return;

      universityData[selectedCountry][selectedCity].forEach(university => {
        const option = document.createElement('option');
        option.value = university;
        option.textContent = university;
        if (university === selectedUniversity) option.selected = true;
        universitiesSelect.appendChild(option);
      });
    }

    function toggleUniversitySection() {
      const hasType = document.getElementById('user_type').value !== '';
      document.getElementById('universitySection').classList.toggle('hidden', !hasType);
      document.getElementById('citySection').classList.toggle('hidden', !hasType);
      document.getElementById('universityField').classList.toggle('hidden', !hasType);
    }

    populateSelect('language', languages, currentValues.language, false, 'Select a language');
    populateSelect('language2', languages, currentValues.language2, true, 'None');
    populateSelect('hobby_1', hobbiesList, currentValues.hobby1, true, 'Select one');
    populateSelect('hobby_2', hobbiesList, currentValues.hobby2, true, 'Select another one');
    populateSelect('favorite_sport_1', sportsList, currentValues.sport1, true, 'Select one');
    populateSelect('favorite_sport_2', sportsList, currentValues.sport2, true, 'Select another one');
    populateSelect('country', Object.keys(universityData), currentValues.country, false, 'Select a country');
    loadCities(currentValues.country, currentValues.city);
    loadUniversities(currentValues.country, currentValues.city, currentValues.university);
    toggleUniversitySection();

    document.getElementById('user_type').addEventListener('change', toggleUniversitySection);
    document.getElementById('country').addEventListener('change', function () {
      loadCities(this.value);
      loadUniversities(this.value, '');
    });
    document.getElementById('city').addEventListener('change', function () {
      loadUniversities(document.getElementById('country').value, this.value);
    });
  </script>
</body>
</html>
