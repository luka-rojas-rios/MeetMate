<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matching Profile · MeetMate</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page">

  <nav class="topbar">
    <a href="/dashboard" class="brand small">
      <img src="/static/logo.jpeg" alt="Logo MeetMate">
      <span>MeetMate</span>
    </a>

    <div class="topbar-links">
      <a href="/dashboard">Panel</a>
      <a href="/my-matches">My Matches</a>
      <a href="/events">Events</a>
      <a href="/feedback">Feedback</a>
      <a href="/logout" class="danger-link">Logout</a>
    </div>
  </nav>

  <main class="form-page">
    <section class="split-card">
      <div class="split-visual matching-visual">
        <div>
          <p class="eyebrow">MATCHING</p>
          <h1>Find compatible people</h1>
          <p>
            Complete your preferences to find profiles with compatible interests,
            languages and universities.
          </p>
        </div>
      </div>

      <div class="split-content">
        {% if error %}
          <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if success %}
          <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form action="/match-profile" method="post" class="form">
          <label for="user_type">User Type</label>
          <select id="user_type" name="user_type" required>
            <option value="">Select an option</option>
            <option value="Exchange" {% if user.user_type == "Exchange" %}selected{% endif %}>Exchange</option>
            <option value="Local" {% if user.user_type == "Local" %}selected{% endif %}>Local</option>
          </select>

          <div class="two-columns">
            <div>
              <label for="language">Main Language</label>
              <select id="language" name="language" required>
                <option value="">Select a language</option>
                <option value="Spanish" {% if user.language == "Spanish" %}selected{% endif %}>Spanish</option>
                <option value="English" {% if user.language == "English" %}selected{% endif %}>English</option>
                <option value="French" {% if user.language == "French" %}selected{% endif %}>French</option>
                <option value="German" {% if user.language == "German" %}selected{% endif %}>German</option>
                <option value="Italian" {% if user.language == "Italian" %}selected{% endif %}>Italian</option>
                <option value="Portuguese" {% if user.language == "Portuguese" %}selected{% endif %}>Portuguese</option>
                <option value="Dutch" {% if user.language == "Dutch" %}selected{% endif %}>Dutch</option>
              </select>
            </div>

            <div>
              <label for="language_2">Second Language</label>
              <select id="language_2" name="language_2">
                <option value="">No second language</option>
                <option value="Spanish" {% if user.language_2 == "Spanish" %}selected{% endif %}>Spanish</option>
                <option value="English" {% if user.language_2 == "English" %}selected{% endif %}>English</option>
                <option value="French" {% if user.language_2 == "French" %}selected{% endif %}>French</option>
                <option value="German" {% if user.language_2 == "German" %}selected{% endif %}>German</option>
                <option value="Italian" {% if user.language_2 == "Italian" %}selected{% endif %}>Italian</option>
                <option value="Portuguese" {% if user.language_2 == "Portuguese" %}selected{% endif %}>Portuguese</option>
                <option value="Dutch" {% if user.language_2 == "Dutch" %}selected{% endif %}>Dutch</option>
              </select>
            </div>
          </div>

          <div class="two-columns">
            <div>
              <label for="home_university">Home University</label>
              <select id="home_university" name="home_university" required>
                <option value="">Select a university</option>
                <option value="Universidad de Sevilla" {% if user.home_university == "Universidad de Sevilla" %}selected{% endif %}>Sevilla University</option>
                <option value="Universidad de Granada" {% if user.home_university == "Universidad de Granada" %}selected{% endif %}>Granada University</option>
                <option value="Universidad Complutense de Madrid" {% if user.home_university == "Universidad Complutense de Madrid" %}selected{% endif %}>Complutense University of Madrid</option>
                <option value="Universitat de Barcelona" {% if user.home_university == "Universitat de Barcelona" %}selected{% endif %}>Barcelona University</option>
                <option value="Universidad de Valencia" {% if user.home_university == "Universidad de Valencia" %}selected{% endif %}>Valencia University</option>
                <option value="Otra" {% if user.home_university == "Otra" %}selected{% endif %}>Other</option>
              </select>
            </div>

            <div>
              <label for="exchange_university">Exchange University</label>
              <select id="exchange_university" name="exchange_university" required>
                <option value="">Select a university</option>
                <option value="Universidad de Sevilla" {% if user.exchange_university == "Universidad de Sevilla" %}selected{% endif %}>Sevilla University</option>
                <option value="Universidad de Granada" {% if user.exchange_university == "Universidad de Granada" %}selected{% endif %}>Granada University</option>
                <option value="Universidad Complutense de Madrid" {% if user.exchange_university == "Universidad Complutense de Madrid" %}selected{% endif %}>Complutense University of Madrid</option>
                <option value="Universitat de Barcelona" {% if user.exchange_university == "Universitat de Barcelona" %}selected{% endif %}>Barcelona University</option>
                <option value="Universidad de Valencia" {% if user.exchange_university == "Universidad de Valencia" %}selected{% endif %}>Valencia University</option>
                <option value="Otra" {% if user.exchange_university == "Otra" %}selected{% endif %}>Other</option>
              </select>
            </div>
          </div>

          <div class="two-columns">
            <div>
              <label for="favorite_sport_1">Favorite Sport 1</label>
              <select id="favorite_sport_1" name="favorite_sport_1">
                <option value="">Select an option</option>
                <option value="Fútbol" {% if user.favorite_sport_1 == "Fútbol" %}selected{% endif %}>Soccer</option>
                <option value="Baloncesto" {% if user.favorite_sport_1 == "Baloncesto" %}selected{% endif %}>Basketball</option>
                <option value="Tenis" {% if user.favorite_sport_1 == "Tenis" %}selected{% endif %}>Tennis</option>
                <option value="Natación" {% if user.favorite_sport_1 == "Natación" %}selected{% endif %}>Swimming</option>
                <option value="Running" {% if user.favorite_sport_1 == "Running" %}selected{% endif %}>Running</option>
                <option value="Voleibol" {% if user.favorite_sport_1 == "Voleibol" %}selected{% endif %}>Volleyball</option>
                <option value="Gimnasio" {% if user.favorite_sport_1 == "Gimnasio" %}selected{% endif %}>Gymnastics</option>
              </select>
            </div>

            <div>
              <label for="favorite_sport_2">Favorite Sport 2</label>
              <select id="favorite_sport_2" name="favorite_sport_2">
                <option value="">Select an option</option>
                <option value="Fútbol" {% if user.favorite_sport_2 == "Fútbol" %}selected{% endif %}>Soccer</option>
                <option value="Baloncesto" {% if user.favorite_sport_2 == "Baloncesto" %}selected{% endif %}>Basketball</option>
                <option value="Tenis" {% if user.favorite_sport_2 == "Tenis" %}selected{% endif %}>Tennis</option>
                <option value="Natación" {% if user.favorite_sport_2 == "Natación" %}selected{% endif %}>Swimming</option>
                <option value="Running" {% if user.favorite_sport_2 == "Running" %}selected{% endif %}>Running</option>
                <option value="Voleibol" {% if user.favorite_sport_2 == "Voleibol" %}selected{% endif %}>Volleyball</option>
                <option value="Gimnasio" {% if user.favorite_sport_2 == "Gimnasio" %}selected{% endif %}>Gymnastics</option>
              </select>
            </div>
          </div>

          <div class="two-columns">
            <div>
              <label for="hobby_1">Hobby 1</label>
              <select id="hobby_1" name="hobby_1">
                <option value="">Select an option</option>
                <option value="Viajar" {% if user.hobby_1 == "Viajar" %}selected{% endif %}>Travel</option>
                <option value="Leer" {% if user.hobby_1 == "Leer" %}selected{% endif %}>Read</option>
                <option value="Cocinar" {% if user.hobby_1 == "Cocinar" %}selected{% endif %}>Cook</option>
                <option value="Música" {% if user.hobby_1 == "Música" %}selected{% endif %}>Music</option>
                <option value="Series y cine" {% if user.hobby_1 == "Series y cine" %}selected{% endif %}>TV Shows and Movies</option>
                <option value="Senderismo" {% if user.hobby_1 == "Senderismo" %}selected{% endif %}>Hiking</option>
                <option value="Videojuegos" {% if user.hobby_1 == "Videojuegos" %}selected{% endif %}>Video Games</option>
              </select>
            </div>

            <div>
              <label for="hobby_2">Hobby 2</label>
              <select id="hobby_2" name="hobby_2">
                <option value="">Select an option</option>
                <option value="Viajar" {% if user.hobby_2 == "Viajar" %}selected{% endif %}>Travel</option>
                <option value="Leer" {% if user.hobby_2 == "Leer" %}selected{% endif %}>Read</option>
                <option value="Cocinar" {% if user.hobby_2 == "Cocinar" %}selected{% endif %}>Cook</option>
                <option value="Música" {% if user.hobby_2 == "Música" %}selected{% endif %}>Music</option>
                <option value="Series y cine" {% if user.hobby_2 == "Series y cine" %}selected{% endif %}>TV Shows and Movies</option>
                <option value="Senderismo" {% if user.hobby_2 == "Senderismo" %}selected{% endif %}>Hiking</option>
                <option value="Videojuegos" {% if user.hobby_2 == "Videojuegos" %}selected{% endif %}>Video Games</option>
              </select>
            </div>
          </div>

          <div class="button-row">
            <button type="submit" name="action" value="save" class="btn btn-secondary">
              Save profile
            </button>

            <button type="submit" name="action" value="find_match" class="btn btn-primary">
              Save and Find match
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
