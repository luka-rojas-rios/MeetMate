<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover password · MeetMate</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page auth-campus">

  <main class="auth-card">
    <a href="/" class="auth-logo">
      <img src="/static/logo.jpeg" alt="Logo MeetMate">
      <span>MeetMate</span>
    </a>

    <h1>Recover password</h1>
    <p class="muted">Enter your username and answer your security question.</p>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if not question %}
      <form action="/forgot-password" method="post" class="form">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required>

        <button type="submit" class="btn btn-primary full">View question</button>
      </form>
    {% else %}
      <div class="question-box">
        <strong>Security question:</strong>
        <p>{{ question }}</p>
      </div>

      <form action="/reset-password" method="post" class="form">
        <input type="hidden" name="username" value="{{ username }}">

        <label for="security_answer">Answer</label>
        <input id="security_answer" type="text" name="security_answer" required>

        <label for="new_password">New password</label>
        <div class="password-wrapper">
          <input id="new_password" type="password" name="new_password" required>
          <button type="button" class="password-toggle" data-target="new_password">👁</button>
        </div>

        <button type="submit" class="btn btn-primary full">Change password</button>
      </form>
    {% endif %}

    <div class="auth-links">
      <a href="/login">Log back in</a>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
