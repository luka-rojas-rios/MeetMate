<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: rgba(255,255,255,0.92);
      --text: #15304b;
      --muted: #63758a;
      --primary: #1d73e8;
      --primary-dark: #1459b6;
      --secondary: #ebf2fb;
      --border: #d8e2f0;
      --shadow: 0 18px 45px rgba(19, 42, 76, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 42%, #eaf0f8 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }
    .shell { width: 100%; max-width: 1040px; }
    .hero {
      background: linear-gradient(135deg, #ffffff, #eef5ff);
      border: 1px solid rgba(216, 226, 240, 0.8);
      box-shadow: var(--shadow);
      border-radius: 28px;
      overflow: hidden;
    }
    .hero-main { padding: 42px; }
    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: #eaf3ff;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 18px;
    }
    h1 { font-size: 42px; line-height: 1.05; margin: 0 0 12px; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .btn {
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      font-weight: 700;
      transition: .2s ease;
      box-shadow: 0 10px 26px rgba(17, 38, 68, 0.06);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: white; }
    .btn.primary:hover { background: var(--primary-dark); }
    @media (max-width: 850px) {
      .hero-main { padding: 28px; }
      .actions { grid-template-columns: 1fr; }
      h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <section class="hero-main">
        <div class="eyebrow">MeetMate · Student platform</div>
        <h1>Welcome back, {{ username }}</h1>
        <div class="actions">
          <a class="btn primary" href="/events">Events and announcements</a>
          <a class="btn" href="/match-profile">Matching profile</a>
          <a class="btn" href="/edit-profile">Edit personal profile</a>
          <a class="btn" href="/events#add-event">Quick add event</a>
          <a class="ghost-btn" href="/feedback">Share your experience</a>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
