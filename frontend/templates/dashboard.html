<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MeetMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page narrow">
    <div class="topbar">
      <div class="brand">MeetMate</div>
    </div>

    <section class="panel">
      <h1>Welcome back, {{ username }}</h1>
      <p class="subtitle">Jump back into matching, events or your profile.</p>

      <div class="grid two">
        <a class="btn primary" href="/match-profile">Find a match</a>
        <a class="btn" href="/events">Events</a>
        <a class="btn" href="/edit-profile">Edit profile</a>
        <a class="btn" href="/feedback">Share feedback</a>
      </div>
    </section>
  </div>
</body>
</html>
