<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit profile - MeetMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page narrow">
    <div class="topbar">
      <div class="brand">MeetMate</div>
      <a class="btn" href="/dashboard">Back to dashboard</a>
    </div>

    {% if message %}<div class="flash success">{{ message }}</div>{% endif %}

    <section class="panel">
      <h1>Edit personal profile</h1>
      <p class="subtitle">Update your personal information.</p>

      <form method="POST" action="/edit-profile" class="grid two">
        <div>
          <label for="first_name">First name</label>
          <input id="first_name" type="text" name="first_name" value="{{ user.first_name or '' }}">
        </div>
        <div>
          <label for="last_name">Last name</label>
          <input id="last_name" type="text" name="last_name" value="{{ user.last_name or '' }}">
        </div>
        <div>
          <label for="birth_date">Birth date</label>
          <input id="birth_date" type="date" name="birth_date" value="{{ user.birth_date or '' }}">
        </div>
        <div>
          <label for="sex">Sex</label>
          <select id="sex" name="sex">
            <option value="">Select</option>
            <option value="Female" {% if user.sex == "Female" %}selected{% endif %}>Female</option>
            <option value="Male" {% if user.sex == "Male" %}selected{% endif %}>Male</option>
            <option value="Other" {% if user.sex == "Other" %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div>
          <label for="nationality">Nationality</label>
          <input id="nationality" type="text" name="nationality" value="{{ user.nationality or '' }}">
        </div>
        <div>
          <label for="phone">Phone</label>
          <input id="phone" type="text" name="phone" value="{{ user.phone or '' }}">
        </div>

        <div class="full actions">
          <button class="btn primary" type="submit">Save profile</button>
          <a class="btn" href="/dashboard">Cancel</a>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
